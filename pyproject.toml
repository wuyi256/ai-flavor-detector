[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-flavor-detector"
version = "0.4.0"
description = "AI 味检测器：给你的文字打个「AI 浓度分」，把 AI 陈词滥调统统标红"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["nlp", "ai-detection", "writing", "chinese", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.scripts]
aiflavor = "aiflavor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
