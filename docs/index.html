    const re = c[1]==="en" ? new RegExp("\\b"+escapeRe(c[0])+"\\b","g")
                          : new RegExp(escapeRe(c[0]),"g");
    const src = c[1]==="en" ? lower : t;
    let m, count=0, opening=0;
    while((m=re.exec(src))!==null){
      count++;
      if(c[2]==="template" && countUnits(t.slice(0,m.index))<OPEN_WINDOW) opening++;
    }
    if(count) hits.push({c:c,count:count,opening:opening});
  }
  hits.sort((a,b)=>b.c[3]*b.count-a.c[3]*a.count);
  return hits;
}
function cvOf(lens){
  if(lens.length<4) return -1;
  const mean=lens.reduce((a,b)=>a+b,0)/lens.length;
  if(mean===0) return -1;
  const sd=Math.sqrt(lens.reduce((s,x)=>s+(x-mean)*(x-mean),0)/lens.length);
  return sd/mean;
}
function uniformityPoints(t){
  const sents=splitSentences(t);
  const sentLens=sents.map(countUnits).filter(u=>u>=3);
  const clauseLens=[];
  for(const s of sents)
    for(const c of s.split(/[,，、;；:：]/))
      if(countUnits(c)>=2) clauseLens.push(countUnits(c));
  const scv=cvOf(sentLens), ccv=cvOf(clauseLens);
  const sp=scv>=0?MAX_UNIFORM*Math.max(0,1-scv/CV_SPAN):0;
  const cp=ccv>=0?MAX_UNIFORM*Math.max(0,1-ccv/CV_SPAN):0;
  return [Math.max(sp,0.8*cp), scv, ccv];
}
function starterRepetition(t){
  const sents=splitSentences(t).filter(s=>countUnits(s)>=3);
  if(sents.length<4) return [0,"",0];
  const starters=[];
  for(const s of sents){
    const m=s.match(/^[A-Za-z]+(?:[-'][A-Za-z]+)*/);
    if(m){ starters.push(m[0].toLowerCase()); continue; }
    const zh=s.match(/[一-鿿]/g);
    if(zh && zh.length>=2) starters.push(zh.slice(0,2).join(""));
  }
  if(!starters.length) return [0,"",0];
  const freq={}; let top="",n=0;
  for(const st of starters){
    freq[st]=(freq[st]||0)+1;
    if(freq[st]>n){n=freq[st];top=st;}
  }
  if(n>=3) return [Math.min(6,(n-2)*2),top,n];
  return [0,top,n];
}
// 对仗平衡：关联词成对出现 >=2 组才加分（单组是正常用法）
const ZH_PAIRS=[[["不仅","不但"],["而且"]],[["虽然"],["但是","但"]],[["既"],["又"]],[["无论"],["都"]],[["与其"],["不如"]]];
const EN_PAIRS=[[["not only"],["but also"]],[["on the one hand"],["on the other hand"]]];
function pairPoints(t){
  const lower=t.toLowerCase(); let pairs=0;
  for(const p of ZH_PAIRS) if(p[0].some(k=>t.includes(k))&&p[1].some(k=>t.includes(k))) pairs++;
  for(const p of EN_PAIRS) if(p[0].some(k=>lower.includes(k))&&p[1].some(k=>lower.includes(k))) pairs++;
  if(pairs>=3) return [MAX_PAIR,pairs];
  if(pairs===2) return [3,pairs];
  return [0,pairs];
}
// 空泛度：全文没有一个数字、引用或句中专有名词
function genericPoints(t,units){
  const spec=(t.match(/\d/g)||[]).length
           +(t.match(/[「」《》"']/g)||[]).length
           +(t.match(/(?<=[a-z] )[A-Z][A-Za-z]+/g)||[]).length;
  if(spec>0) return 0;
  if(units>=120) return MAX_GENERIC;
  if(units>=60) return 3;
  return 0;
}
// ---- 人味信号（减分项）----
const ZH_COLLOQUIAL=["真的","感觉","好家伙","笑死","绷不住","破防","无语","绝了","yyds","绝绝子","牛逼","贼","巨","超","寄","摆烂","摸鱼","干饭","早八","抢课","食堂","宿舍","室友","阿姨"];
const EN_INFORMAL=["gonna","wanna","kinda","sorta","lol","lmao","tbh","imo","ngl","btw","stuff","yeah","nah","ok","okay"];
const ZH_FILLERS=["然后","就是","那个","反正","话说"];
const PERSONAL_RE=/我妈|我爸|我室友|舍友|我同学|我老师|我同事|我老板|我上次|我当时|我小时候|我高中|我大学|我奶|我爷|my (?:mom|dad|roommate|boss|teacher|grandma|grandpa|friend)/gi;
function humanPoints(t){
  let pts=0; const sigs=[];
  const add=(kind,count,w,cap)=>{
    if(count<=0) return;
    const p=round1(Math.min(count,cap)*w);
    pts+=p; sigs.push({kind:kind,count:count,points:p});
  };
  add("中文语气词",(t.match(/[吧呢呗嘛啦哦嗯][，。！？!?,.\s]/g)||[]).length,1.5,6);
  add("中文口语/网络用语",ZH_COLLOQUIAL.filter(w=>t.includes(w)).length,2,5);
  add("口头禅/填充词",ZH_FILLERS.reduce((s,w)=>s+t.split(w).length-1,0),0.5,3);
  add("私人指称",(t.match(PERSONAL_RE)||[]).length,1,3);
  add("英文缩略形式",(t.match(/\b\w+(?:n't|'m|'re|'ve|'ll|'d)\b/gi)||[]).length,1,6);
  const lower=t.toLowerCase();
  add("英文口语",EN_INFORMAL.filter(w=>new RegExp("\\b"+escapeRe(w)+"\\b","i").test(lower)).length,2,4);
  add("emoji",(t.match(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}]/gu)||[]).length,1.5,5);
  add("省略号",(t.match(/……|\.\.\./g)||[]).length,1.5,3);
  add("感叹号",(t.match(/[！!]/g)||[]).length,0.5,6);
  add("问句",(t.match(/[？?]/g)||[]).length,0.5,3);
  add("破折号/波浪号",(t.match(/——|[—~～]/g)||[]).length,1,3);
  add("短句",splitSentences(t).filter(s=>countUnits(s)>=1&&countUnits(s)<=6).length,1,4);
  return {points:Math.min(MAX_HUMAN,round1(pts)),sigs:sigs};
}
function verdict(score){
  if(score<20) return ["人味十足","这文字一看就是活人写的"];
  if(score<40) return ["略有 AI 嫌疑","有几处可疑，但总体像人写的"];
  if(score<60) return ["AI 味明显","不少地方透着机器腔，建议逐条改"];
  if(score<80) return ["AI 浓度超标","大词套话成堆，人味儿快没了"];
  return ["铁 AI，建议回炉重写","从头到脚都是套路，重写比改快"];
}
function stampText(score){
  if(score<20) return "人味\n十足";
  if(score<40) return "略有\n嫌疑";
  if(score<60) return "AI 味\n明显";
  if(score<80) return "浓度\n超标";
  return "铁 AI";
}
function analyze(text){
  text=(text||"").trim();
  const units=countUnits(text);
  if(units<MIN_UNITS) return {tooShort:true,units:units};
  const hits=findHits(text);
  let clicheWeighted=0, connectorCount=0, openingCount=0;
  for(const h of hits){
    if(h.c[2]==="connector"){ connectorCount+=h.count; continue; }
    clicheWeighted += h.c[3]*h.count + h.c[3]*h.opening*OPEN_BONUS;
    openingCount += h.opening;
  }
  // 平滑密度：分母 +40，防止短文本里单个命中被放大
  const clichePts=Math.min(MAX_CLICHE, clicheWeighted/(units+40)*100*CLICHE_SCALE);
  const connPts=Math.min(MAX_CONNECTOR, connectorCount/(units+40)*100*6);
  const u=uniformityPoints(text);
  let patPts=0;
  if((text.match(/^\s*(?:[-*•]|\d{1,2}[.、)）])\s/gm)||[]).length>=3) patPts+=4;
  if(/首先[\s\S]{0,400}?其次[\s\S]{0,400}?(最后|再次)/.test(text)
  || /first(ly)?\b[\s\S]{0,400}?\bsecond(ly)?\b[\s\S]{0,400}?\b(finally|third(ly)?)\b/i.test(text)) patPts+=4;
  const st=starterRepetition(text);
  patPts=Math.min(MAX_PATTERN, patPts+st[0]);
  const pp=pairPoints(text), generic=genericPoints(text,units);
  const human=humanPoints(text);
  const score=Math.min(100,Math.max(0,round1(clichePts+u[0]+connPts+patPts+pp[0]+generic-human.points)));
  return {
    score:score, hits:hits, units:units,
    clichePts:round1(clichePts), uniPts:round1(u[0]), sentCv:u[1], clauseCv:u[2],
    connPts:round1(connPts), patPts:round1(patPts),
    starterPts:round1(st[0]), starter:st[0]>0?st[1]:"",
    openingCount:openingCount, pairPts:round1(pp[0]), pairCount:pp[1],
    genericPts:round1(generic),
    humanPts:human.points, humanSigs:human.sigs,
    hitCount:hits.reduce((s,h)=>s+h.count,0)
  };
}
if (typeof module!=="undefined" && module.exports) module.exports={analyze:analyze};

if (typeof document!=="undefined"){
const escapeHtml=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const $=id=>document.getElementById(id);

function highlight(text,hits){
  if(!hits.length) return escapeHtml(text);
  const tips={};
  const parts=hits.slice().sort((a,b)=>b.c[0].length-a.c[0].length).map(h=>{
    tips[h.c[0].toLowerCase()]=h.c[4];
    return h.c[1]==="en" ? "\\b"+escapeRe(h.c[0])+"\\b" : escapeRe(h.c[0]);
  });
  const re=new RegExp("("+parts.join("|")+")","gi");
  let out="",last=0,m;
  while((m=re.exec(text))!==null){
    const tip=tips[m[0].toLowerCase()]||"";
    out+=escapeHtml(text.slice(last,m.index))
        +'<u class="hit" data-tip="'+escapeHtml(m[0]+" → "+tip)+'">'+escapeHtml(m[0])+"</u>";
    last=m.index+m[0].length;
  }
  return out+escapeHtml(text.slice(last));
}
function repNumber(text){
  let h=0;
  for(let i=0;i<text.length;i++){ h=(h*31+text.charCodeAt(i))>>>0; }
  return "№ "+h.toString(16).toUpperCase().padStart(8,"0").slice(0,6);
}
function bdRow(name,val,max,note,minus){
  return '<div class="bd-row'+(minus?' minus':'')+'">'
    +'<span class="name">'+name+'</span><span class="dots"></span>'
    +'<span class="note">'+(note||"")+'</span>'
    +'<span class="val">'+(minus?'-':'')+round1(val)+' / '+max+'</span></div>';
}
function render(text,r){
  $("result").style.display="block";
  $("repNo").textContent=repNumber(text);
  $("repDate").textContent=new Date().toISOString().slice(0,10).replace(/-/g,".");
  $("score").textContent=r.score;
  const v=verdict(r.score);
  $("verdict").textContent=v[0];
  $("verdict").style.color = r.score<40 ? "var(--human)" : "var(--seal)";
  $("verdictSub").textContent=v[1];
  $("stamp").textContent=stampText(r.score).replace("\n","");
  $("stamp").style.whiteSpace="pre-line";

  let bd="";
  bd+=bdRow("陈词滥调密度",r.clichePts,55,
    r.openingCount?("命中 "+r.hitCount+" 处，含开场套路 ×"+r.openingCount):("命中 "+r.hitCount+" 处"));
  bd+=bdRow("节奏均匀度",r.uniPts,25,
    r.sentCv>=0?("句长CV "+r.sentCv.toFixed(2)+" / 分句CV "+(r.clauseCv>=0?r.clauseCv.toFixed(2):"—")):"句子太少，不评");
  bd+=bdRow("八股连接词",r.connPts,12,"");
  bd+=bdRow("套路结构",r.patPts,10,
    r.starterPts?("含句首重复「"+r.starter+"」+"+r.starterPts):"");
  bd+=bdRow("对仗平衡",r.pairPts,5,
    r.pairCount>=2?("关联词成对 ×"+r.pairCount):"");
  bd+=bdRow("空泛度",r.genericPts,5,
    r.genericPts?"全文无数字/引用/专有名词":"");
  bd+=bdRow("人味信号",r.humanPts,20,r.humanPts?"活人证据，减分":"",true);
  $("breakdown").innerHTML=bd;

  $("hl").innerHTML=highlight(text,r.hits);

  const tips=r.hits.slice(0,6).map(h=>"<li>「<b>"+escapeHtml(h.c[0])+"</b>」→ "+escapeHtml(h.c[4])+"</li>");
  $("tips").innerHTML=tips.join("")||"<li>没命中词库。分数若仍偏高，问题在句子和结构上——把长句拆碎，塞点只有你知道的细节。</li>";

  if(r.humanSigs.length){
    $("sigBlock").style.display="block";
    $("sigs").innerHTML=r.humanSigs.map(s=>
      '<div class="sig">'+escapeHtml(s.kind)+" ×"+s.count+"（减 "+s.points+" 分）</div>").join("");
  }else{
    $("sigBlock").style.display="none";
  }
}
function run(){
  const text=$("input").value.trim();
  if(countUnits(text)<MIN_UNITS){
    $("result").style.display="none";
    return;
  }
  render(text,analyze(text));
}
let timer=null;
$("input").addEventListener("input",()=>{
  const n=countUnits($("input").value);
  $("count").textContent="已输入 "+n+" 字（英文按词计）"+(n>0&&n<MIN_UNITS?"，再写点":"" );
  clearTimeout(timer);
  timer=setTimeout(run,300);
});
function clearAll(){
  $("input").value="";
  $("count").textContent="已输入 0 字（英文按词计）";
  $("result").style.display="none";
  $("input").focus();
}
const SAMPLES={
ai:"综上所述，随着时代的不断发展，人工智能正在全方位赋能各行各业。首先，它为组织提供了新的抓手，帮助企业打通业务链路。其次，通过多维度的系统性打法，可以形成完整的商业闭环。值得注意的是，这种变革的重要性不言而喻。与此同时，我们也应当看到其在一定程度上带来的深层次影响。总而言之，只有积极拥抱变化，才能在新征程上立于不败之地。",
human:"今天中午食堂的糖醋排骨又涨价了，气死。不过打饭阿姨手没抖，给了我四大块，行吧，原谅她了。下午实验课困得要命，昨晚熬夜赶报告，三点多才睡——还好同桌带了风油精，往太阳穴一抹，直接清醒。回宿舍路上下雨了，我没带伞，一路小跑，鞋全湿。明天早八，闹钟定了三个，你说我能起得来吗？"
